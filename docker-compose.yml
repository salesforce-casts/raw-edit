services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rawedit
      POSTGRES_PASSWORD: rawedit
      POSTGRES_DB: rawedit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rawedit
      MINIO_ROOT_PASSWORD: raweditsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 rawedit raweditsecret;
      mc mb --ignore-existing local/rawedit-dev;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
